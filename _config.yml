# ---------------------------------------------------------------------------
# Site configuration
#
# Most of your content lives in the _data/ folder (profile, news,
# publications, teaching, talks) and in index.md (your bio). You should rarely
# need to touch this file. If you run the site locally, restart the server
# after editing it.
# ---------------------------------------------------------------------------

title: Shubham Bhardwaj
tagline: PhD Student in Theoretical Computer Science at TIFR
description: >-
  PhD student in theoretical computer science at the School of Technology and
  Computer Science, Tata Institute of Fundamental Research (TIFR), Mumbai.
url: "https://sbyb.github.io"
baseurl: ""
lang: en
timezone: Asia/Kolkata

# Used by jekyll-seo-tag for search engines and link previews
author:
  name: Shubham Bhardwaj
  url: "https://sbyb.github.io"
social:
  name: Shubham Bhardwaj
  links:
    - "https://github.com/sbyb"

# Build settings (everything here is supported by GitHub Pages out of the box)
theme: null # the site ships its own layouts; don't pull in GitHub's default theme
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
  - .jekyll-cache

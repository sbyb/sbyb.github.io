# ---------------------------------------------------------------------------
# Publications. Entries are grouped by year (newest first) on the
# Publications page. Your own name is highlighted automatically.
#
# Fields:
#   title      (required)
#   authors    (required) list of names; use exactly your name from
#              _data/profile.yml so it gets highlighted
#   year       (required)
#   venue      short venue label shown as a badge, e.g. "STOC 2026" or "arXiv"
#   venue_full full venue name, e.g. "Proceedings of the 58th Annual ACM
#              Symposium on Theory of Computing (STOC 2026)"
#   type       conference | journal | preprint | thesis   (default: conference)
#   selected   true to feature it on the home page
#   note       short extra line, e.g. "Invited to the SICOMP special issue"
#   links      list of { label, url }, e.g. arXiv, ECCC, PDF, DOI, Slides, Video
#   abstract   optional; shown behind an "Abstract" toggle
#   bibtex     optional; shown behind a "BibTeX" toggle with a copy button
#
# Example:
# - title: "A Sample Paper Title"
#   authors: [Alice Author, Shubham Bhardwaj, Bob Author]
#   year: 2026
#   venue: STOC 2026
#   venue_full: Proceedings of the 58th Annual ACM Symposium on Theory of Computing
#   type: conference
#   selected: true
#   links:
#     - { label: arXiv, url: "https://arxiv.org/abs/2601.00000" }
#     - { label: ECCC, url: "https://eccc.weizmann.ac.il/report/2026/000/" }
#   bibtex: |
#     @inproceedings{AuthorBhardwajAuthor26,
#       title     = {A Sample Paper Title},
#       author    = {Author, Alice and Bhardwaj, Shubham and Author, Bob},
#       booktitle = {Proceedings of the 58th Annual ACM Symposium on Theory of Computing},
#       year      = {2026}
#     }
# ---------------------------------------------------------------------------
# Add your entries below this line (remove the leading "# " from the example
# to use it as a starting point).
